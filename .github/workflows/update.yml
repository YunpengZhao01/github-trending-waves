# Refreshes results/ every day and commits the new charts and tables.
# Enable it in your fork under Settings -> Actions -> General -> "Read and write permissions".
name: Daily update

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC, after the archive has captured the previous day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .trendwaves-cache
          key: trendwaves-${{ github.run_id }}
          restore-keys: trendwaves-
      - run: pip install .
      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: trendwaves run --start 2026-01-01 --out results -v
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Update results for $(date -u +%F)"
          git push
