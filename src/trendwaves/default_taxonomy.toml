subtopic = "Media, music & creative"
pattern = 'music|audio|video|image editor|photo|\b3d\b|blender|media player|media server|animation|streaming|youtube|spotify|podcast|\bflac\b|download(er)?|manga|anime|ebook|reader|drawing|subtitle'

# ------------------------------------------------------ Finance & commerce
[[rule]]
topic = "Finance & commerce"
