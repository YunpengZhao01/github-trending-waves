subtopic = "Mobile & desktop apps"
pattern = '\bios\b|android|swiftui|\bswift\b|\bmacos\b|\bwindows\b|electron|tauri|flutter|react native|desktop app|mobile app|\bkotlin\b|menu ?bar|\blinux desktop\b|\bapp store\b'

[[rule]]
topic = "Web & apps"
subtopic = "Frontend & UI"
pattern = 'frontend|front end|\breact\b|\bvue\b|svelte|solid ?js|\bsolid\b|next ?js|nuxt|tailwind|component|\bui\b|\bux\b|web design|\bcss\b|typescript|javascript|design system|landing page|dashboard|website builder|\bfigma\b|icons?\b'

[[rule]]
topic = "Web & apps"
subtopic = "Backend & web platforms"
pattern = 'backend|\bbaas\b|supabase|appwrite|firebase|\bcms\b|headless|web framework|\bapi\b server|\brest api\b|graphql|server ?less|\bauth\b server|e ?commerce|\bnocode\b|no code|low code|\bnocodb\b|\bnode\.?js\b|\bdeno\b|\bbun\b|\bdjango\b|\bfastapi\b|\brails\b|\blaravel\b|\bphp\b'

# --------------------------------------------------------- Developer tools
[[rule]]
topic = "Developer tools"
subtopic = "Infra, cloud & self-hosting"
pattern = 'docker|kubernetes|\bk8s\b|container|cloud native|terraform|infrastructure|devops|observability|monitoring|self ?host|homelab|\bnas\b|deploy|\bpaas\b|reverse proxy|\bnginx\b|server management|\bci ?/? ?cd\b|serverless'

[[rule]]
