# ---------------------------------------------------- Learning & resources
[[rule]]
topic = "Learning & resources"
subtopic = "Courses, books & guides"
pattern = 'awesome|curated list|tutorial|course|cookbook|book|roadmap|interview|learn|education|beginner|guide|cheat ?sheet|handbook|free .*resources|lessons?|study|notes'

[[rule]]
topic = "Learning & resources"
subtopic = "Science & research"
pattern = 'research|paper|science|physics|math|biology|chemistr|algorithm|quantum|bioinformatic|astronom|\bmedical\b|\bhealth\b'

# -------------------------------------------------- Media & entertainment
[[rule]]
