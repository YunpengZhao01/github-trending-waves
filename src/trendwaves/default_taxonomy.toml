pattern = 'network|protocol|\bquic\b|\bhttp\b|\btcp\b|\bp2p\b|peer to peer|file transfer|kernel|operating system|\bsystemd\b|\bc\+\+|\brust\b|\bzig\b|embedded|firmware|hardware|radar|\biot\b|zigbee|home assistant|smart home|\bgpu\b|\bcuda\b|\bbrowser\b|\bwasm\b|webassembly|library|framework'

# ---------------------------------------------------------- Everyday tools
[[rule]]
topic = "Everyday tools"
subtopic = "Productivity & communication"
pattern = 'note|notion|obsidian|calendar|todo|task manag|email|\bmail\b|chat|messag|telegram|discord|wechat|slack|whatsapp|\brss\b|news|bookmark|knowledge management|\bpkm\b|\bmaps?\b|navigation|translat|clipboard|launcher|wallpaper|keyboard|flashcard|spaced repetition|emoji|\biptv\b|\btv\b'

# --------------------------------------------- catch-all for generic AI apps
# Kept last so that "AI-powered <something>" is first labelled by its <something>.
[[rule]]
topic = "AI & ML"
subtopic = "Other AI apps"
pattern = '\bai\b|artificial intelligence|\bgenai\b'
